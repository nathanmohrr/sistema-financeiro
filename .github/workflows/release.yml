name: Build e Publicação Automática
on:
  push:
    tags:
      - 'v*' # Ex: v1.0.0 → publica automaticamente

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build e Publicar Release
        run: npx electron-builder --win
        env:
          # O electron-builder precisa do token neste passo!
          GH_TOKEN: ${{ secrets.GH_TOKEN }}