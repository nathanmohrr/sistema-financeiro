name: Build e Publicação Automática

on:
  push:
    tags:
      - 'v*' # Sempre que tu criar uma tag tipo v1.0.0, ele vai rodar

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependências
        run: npm ci

      - name: Gerar instalador
        run: npx electron-builder --win

      - name: Publicar Release no GitHub
        run: node scripts/publish-release.js
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
